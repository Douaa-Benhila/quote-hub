<header class="navbar-shadow p-3 mb-4">
  <div class="container flex justify-content-between align-items-center">
    <a class="navbar-logo flex gap-2 align-items-center" href="/">
      <img ngSrc="/quote-hub-image.png" alt="Logo Quote Hub" width="36" height="36" />
      Quote Hub
    </a>
    <div class="flex gap-2">
      <p-button
        [icon]="isDark() ? 'pi pi-sun' : 'pi pi-moon'"
        size="small"
        severity="secondary"
        ariaLabel="Changer de thème"
        (onClick)="toggleDarkMode()"
      />
      <p-button label="Ajouter" icon="pi pi-plus" size="small" />
    </div>
  </div>
</header>
