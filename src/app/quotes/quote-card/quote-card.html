<p-card class="mb-3">
  <div class="flex justify-content-between align-items-center mb-2">
    <div>
      <h3 class="m-0">{{ quote().title }}</h3>
      <div class="text-sm text-color-secondary">&#64;{{ quote().author.username }}</div>
    </div>
    <div class="flex gap-2">
      <p-button icon="pi pi-pencil" size="small" [text]="true" />
      <p-button icon="pi pi-copy" size="small" [text]="true" (onClick)="copyToClipboard()" />
    </div>
  </div>

  <p class="quote-text">{{ quote().content }}</p>

  <div class="flex justify-content-between align-items-center">
    <p-tag [value]="quote().category.name" severity="secondary" />
    <div class="flex gap-2 align-items-center">
      <p-button severity="secondary" icon="pi pi-thumbs-up" size="small" />
      <span>{{ quote().score }}</span>
      <p-button severity="secondary" icon="pi pi-thumbs-down" size="small" />
    </div>
  </div>
</p-card>
